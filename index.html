<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 28px 20px 120px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .date {
      color: #888;
      font-size: 14px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 30px;
    }

    /* =========================
       等级
    ========================= */

    .level-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .05);
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .progress {
      height: 10px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #222;
      border-radius: 10px;
      transition: width .3s ease;
    }

    .total-xp {
      margin-top: 10px;
      color: #999;
      font-size: 12px;
    }

    /* =========================
       今日任务
    ========================= */

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
    }

    .clear-today {
      border: none;
      background: transparent;
      color: #999;
      font-size: 12px;
      cursor: pointer;
      padding: 6px;
    }

    .task {
      background: white;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .04);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .emoji {
      font-size: 28px;
      width: 38px;
      text-align: center;
      flex-shrink: 0;
    }

    .task-info {
      min-width: 0;
    }

    .task-name {
      font-weight: 650;
      word-break: break-word;
    }

    .task-detail {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .task-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .more {
      border: none;
      background: #f1f1f3;
      color: #777;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
    }

    .plus {
      border: none;
      background: #222;
      color: white;
      min-width: 54px;
      height: 50px;
      padding: 0 13px;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .plus:active {
      transform: scale(.94);
    }

    .plus.done {
      min-width: 88px;
      background: #e8e8ea;
      color: #777;
      font-size: 13px;
      cursor: default;
    }

    .add-task {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      border: 2px dashed #ccc;
      background: transparent;
      border-radius: 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .streak {
      text-align: center;
      margin-top: 28px;
      font-weight: 650;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      color: #999;
      text-align: center;
    }

    /* =========================
       成就页面
    ========================= */

    .achievement-header {
      margin-bottom: 22px;
    }

    .achievement-header h1 {
      margin-bottom: 6px;
    }

    .achievement-subtitle {
      color: #999;
      font-size: 14px;
    }

    .achievement-summary {
      background: #222;
      color: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .achievement-summary-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .achievement-summary-label {
      font-size: 13px;
      opacity: .7;
      margin-bottom: 5px;
    }

    .achievement-summary-number {
      font-size: 30px;
      font-weight: 800;
    }

    .achievement-summary-percent {
      font-size: 14px;
      opacity: .75;
    }

    .achievement-summary .progress {
      background: rgba(255,255,255,.18);
    }

    .achievement-summary .progress-bar {
      background: white;
    }

    .achievement-group {
      margin-bottom: 28px;
    }

    .achievement-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .achievement-card {
      background: white;
      border-radius: 17px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      gap: 13px;
      align-items: center;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .035);
    }

    .achievement-card.locked {
      opacity: .55;
    }

    .achievement-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #f2f2f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .achievement-card.unlocked .achievement-icon {
      background: #222;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
    }

    .achievement-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .achievement-desc {
      color: #999;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .achievement-progress-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .achievement-mini-progress {
      height: 6px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      flex: 1;
    }

    .achievement-mini-bar {
      height: 100%;
      background: #222;
      border-radius: 10px;
    }

    .achievement-progress-text {
      font-size: 11px;
      color: #999;
      min-width: 58px;
      text-align: right;
    }

    .unlocked-badge {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }


    /* =========================
       统计页面
    ========================= */

    .stats-header {
      margin-bottom: 18px;
    }

    .stats-header h1 {
      margin-bottom: 6px;
    }

    .stats-subtitle {
      color: #999;
      font-size: 14px;
    }

    .period-tabs {
      display: flex;
      background: #eceef3;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .period-tab {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 11px;
      padding: 9px 6px;
      color: #888;
      cursor: pointer;
      font-size: 13px;
    }

    .period-tab.active {
      background: white;
      color: #222;
      font-weight: 750;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .stats-summary-card {
      background: #222;
      color: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .stats-period-label {
      font-size: 12px;
      opacity: .65;
      margin-bottom: 7px;
    }

    .stats-main-xp {
      font-size: 34px;
      font-weight: 850;
      margin-bottom: 16px;
    }

    .stats-main-xp span {
      font-size: 15px;
      font-weight: 650;
      opacity: .7;
    }

    .stats-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stats-mini {
      background: rgba(255,255,255,.09);
      border-radius: 13px;
      padding: 10px 8px;
      text-align: center;
    }

    .stats-mini-number {
      font-size: 17px;
      font-weight: 800;
    }

    .stats-mini-label {
      font-size: 10px;
      opacity: .65;
      margin-top: 3px;
    }

    .stats-card {
      background: white;
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.04);
    }

    .stats-card-title {
      font-size: 16px;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .stats-card-subtitle {
      color: #999;
      font-size: 11px;
      margin-bottom: 16px;
    }

    .trend-chart {
      height: 160px;
      display: flex;
      align-items: stretch;
      gap: 5px;
      border-bottom: 1px solid #eee;
      padding: 8px 2px 0;
      overflow: hidden;
    }

    .trend-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .trend-value {
      font-size: 9px;
      color: #999;
      height: 15px;
      white-space: nowrap;
    }

    .trend-bar-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .trend-bar {
      width: min(18px, 72%);
      min-height: 2px;
      background: #222;
      border-radius: 6px 6px 2px 2px;
    }

    .trend-label {
      height: 24px;
      padding-top: 6px;
      color: #999;
      font-size: 9px;
      white-space: nowrap;
    }

    .task-stat-row {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f2;
    }

    .task-stat-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .task-stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .task-stat-name {
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .task-stat-xp {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .task-stat-detail {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .stats-empty-small {
      color: #aaa;
      text-align: center;
      font-size: 13px;
      padding: 20px 4px 10px;
    }

    .heatmap-year-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0 14px;
      background: #f6f7f9;
      border-radius: 14px;
      padding: 7px;
    }

    .heatmap-year-btn {
      width: 38px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 18px;
      color: #333;
      box-shadow: 0 1px 5px rgba(0,0,0,.04);
    }

    .heatmap-year-btn:disabled {
      opacity: .25;
      cursor: default;
    }

    .heatmap-year-label {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }

    .heatmap-wrap {
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .heatmap {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 11px);
      grid-auto-columns: 11px;
      gap: 3px;
      width: max-content;
      min-width: 100%;
    }

    .heat-cell {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: #eceef2;
    }

    .heat-cell.level-1 { background: #cfd2d9; }
    .heat-cell.level-2 { background: #9fa4ae; }
    .heat-cell.level-3 { background: #666d78; }
    .heat-cell.level-4 { background: #222; }

    .heat-legend {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      color: #aaa;
      font-size: 10px;
    }

    .heat-legend-box {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: #eceef2;
    }

    .heat-legend-box.l1 { background: #cfd2d9; }
    .heat-legend-box.l2 { background: #9fa4ae; }
    .heat-legend-box.l3 { background: #666d78; }
    .heat-legend-box.l4 { background: #222; }

    .period-note {
      text-align: center;
      color: #aaa;
      font-size: 11px;
      margin-top: 8px;
    }

    /* =========================
       底部导航
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, .96);
      display: flex;
      justify-content: space-around;
      padding: 16px 10px 24px;
      border-top: 1px solid #eee;
      z-index: 10;
    }

    .nav-item {
      color: #999;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .nav-item.active {
      color: #222;
      font-weight: 700;
    }

    /* =========================
       弹窗
    ========================= */

    .modal-bg {
      display: none;
      position: fixed;
      z-index: 20;
      inset: 0;
      background: rgba(0, 0, 0, .38);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 24px;
    }

    .modal h2 {
      margin: 0 0 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      background: white;
    }

    .setting-card {
      background: #f7f7f9;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 16px;
    }

    .setting-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .choice-row {
      display: flex;
      gap: 8px;
    }

    .choice {
      flex: 1;
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: block;
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 11px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .choice input:checked + label {
      background: #222;
      color: white;
      border-color: #222;
    }

    .help {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .fixed-settings,
    .amount-settings {
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .custom-unit {
      display: none;
      margin-top: 10px;
    }

    .custom-unit.show {
      display: block;
    }

    .xp-equation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .xp-equation input {
      width: 75px;
      text-align: center;
    }

    .xp-equation span {
      font-size: 14px;
      white-space: nowrap;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 13px;
      padding: 13px;
      cursor: pointer;
    }

    .btn-light {
      background: #eee;
    }

    .btn-dark {
      background: #222;
      color: white;
    }

    .undo-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      margin-top: 12px;
      background: #f1f1f3;
      color: #333;
      cursor: pointer;
    }

    .btn-danger {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      margin-top: 10px;
      background: #fff0f0;
      color: #c73535;
      cursor: pointer;
    }

    /* =========================
       完成量弹窗
    ========================= */

    .complete-icon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 6px;
    }

    .complete-name {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 22px;
    }

    .amount-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount-input-wrap input {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .amount-unit {
      min-width: 55px;
      font-weight: 650;
    }

    .xp-preview {
      text-align: center;
      font-weight: 700;
      margin: 18px 0 5px;
      font-size: 17px;
    }

    /* =========================
       撤销今日
    ========================= */

    .clear-icon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .clear-title {
      text-align: center;
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    .clear-summary {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .today-records {
      background: #f7f7f9;
      border-radius: 15px;
      padding: 12px 14px;
      max-height: 220px;
      overflow-y: auto;
    }

    .today-record {
      padding: 8px 0;
      border-bottom: 1px solid #e8e8ea;
      font-size: 13px;
      line-height: 1.5;
    }

    .today-record:last-child {
      border-bottom: none;
    }

    /* =========================
       成就解锁弹窗
    ========================= */

    .unlock-modal {
      text-align: center;
    }

    .unlock-sparkle {
      font-size: 16px;
      color: #999;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .unlock-icon {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .unlock-label {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .unlock-name {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .unlock-desc {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* =========================
       Toast
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 11px 18px;
      border-radius: 30px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 30;
      white-space: nowrap;
      max-width: calc(100% - 30px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.clickable {
      pointer-events: auto;
      cursor: pointer;
    }

  </style>

  <!-- +1 PWA -->
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="+1">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

</head>

<body>

<div class="app">

  <!-- =========================
       今日页面
  ========================= -->

  <div class="page active" id="todayPage">

    <div class="date" id="date"></div>

    <h1>✨ TODAY</h1>


    <div class="level-card">

      <div class="level-row">

        <span id="level">
          Lv. 1
        </span>

        <span id="xpDisplay">
          0 / 100 XP
        </span>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>


      <div
        class="total-xp"
        id="totalXp"
      >
        累计获得 0 XP
      </div>

    </div>


    <div class="section-header">

      <div class="section-title">
        今日任务
      </div>


      <button
        class="clear-today"
        onclick="openClearTodayModal()"
      >
        ↩ 撤销今日记录
      </button>

    </div>


    <div id="taskList"></div>


    <button
      class="add-task"
      onclick="openAddModal()"
    >
      ＋ 添加任务
    </button>


    <div
      class="streak"
      id="streak"
    >
      🔥 连续坚持 0 天
    </div>

  </div>


  <!-- =========================
       成就页面
  ========================= -->

  <div

<script>

  /* =========================================
     数据
  ========================================= */

  const STORAGE_KEY =
    "myLifeGameDataV2";


  let data =
    loadData();


  let editingTaskId =
    null;


  let completingTaskId =
    null;


  let currentPage =
    "today";


  let statsPeriod =
    "week";


  let heatmapYear =
    new Date().getFullYear();


  function makeId() {

    return (
      Date.now().toString(36)
      +
      Math.random().toString(36).slice(2)
    );

  }


  function defaultData() {

    return {

      tasks: [

        {
          id: makeId(),
          name: "打扫卫生",
          emoji: "🧹",
          scoreMode: "amount",
          unit: "分钟",
          amountBase: 1,
          xpPerBase: 1,
          fixedXp: 5,
          oncePerDay: false
        },

        {
          id: makeId(),
          name: "多邻国学习",
          emoji: "🦉",
          scoreMode: "amount",
          unit: "分钟",
          amountBase: 1,
          xpPerBase: 1,
          fixedXp: 5,
          oncePerDay: false
        },

        {
          id: makeId(),
          name: "12点前睡觉",
          emoji: "😴",
          scoreMode: "fixed",
          fixedXp: 10,
          oncePerDay: true,
          unit: "",
          amountBase: 1,
          xpPerBase: 1
        }

      ],

      history: [],

      unlockedAchievements: []

    };

  }


  function loadData() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    let loaded;


    if (saved) {

      try {

        loaded =
          JSON.parse(saved);

      } catch (error) {

        console.error(
          "读取数据失败",
          error
        );

      }

    }


    if (!loaded) {

      loaded =
        defaultData();

    }


    loaded.tasks =
      Array.isArray(loaded.tasks)
        ? loaded.tasks
        : [];


    loaded.history =
      Array.isArray(loaded.history)
        ? loaded.history
        : [];


    if (
      !Array.isArray(
        loaded.unlockedAchievements
      )
    ) {

      loaded.unlockedAchievements =
        [];

    }


    loaded.tasks.forEach(
      task => {

        if (!task.scoreMode) {
          task.scoreMode = "fixed";
        }


        if (
          typeof task.fixedXp !==
          "number"
        ) {

          task.fixedXp =
            Number(task.xp || 5);

        }


        if (
          typeof task.oncePerDay !==
          "boolean"
        ) {

          task.oncePerDay =
            typeof task.repeatable === "boolean"
              ? !task.repeatable
              : false;

        }


        if (
          typeof task.unit !==
          "string"
        ) {

          task.unit = "";

        }


        if (
          typeof task.amountBase !==
          "number"
        ) {

          task.amountBase = 1;

        }


        if (
          typeof task.xpPerBase !==
          "number"
        ) {

          task.xpPerBase = 1;

        }
}
    );


    loaded.history.forEach(
      record => {

        if (
          !("amount" in record)
        ) {

          if (
            record.quantity !== null &&
            record.quantity !== undefined
          ) {

            record.amount =
              Number(record.quantity);

          } else {

            record.amount =
              null;

          }

        }


        if (
          !("unit" in record)
        ) {

          record.unit = "";

        }


        if (
          typeof record.isAmountRecord !==
          "boolean"
        ) {

          record.isAmountRecord =
            (
              record.amount !== null &&
              record.amount !== undefined &&
              Number(record.amount) > 0
            );

        }

      }
    );


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(loaded)
    );


    return loaded;

  }


  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }


  /* =========================================
     页面切换
  ========================================= */

  function switchPage(
    page
  ) {

    currentPage =
      page;


    document
      .querySelectorAll(
        ".page"
      )
      .forEach(
        element =>
          element.classList.remove(
            "active"
          )
      );


    document
      .querySelectorAll(
        ".nav-item"
      )
      .forEach(
        element =>
          element.classList.remove(
            "active"
          )
      );


    if (
      page === "today"
    ) {

      document
        .getElementById(
          "todayPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "todayNav"
        )
        .classList.add(
          "active"
        );

    }


    if (
      page === "achievement"
    ) {

      document
        .getElementById(
          "achievementPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "achievementNav"
        )
        .classList.add(
          "active"
        );


      renderAchievements();

    }


    if (
      page === "stats"
    ) {

      document
        .getElementById(
          "statsPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "statsNav"
        )
        .classList.add(
          "active"
        );


      renderStats();

    }


    window.scrollTo(
      0,
      0
    );

  }


  /* =========================================
     日期
  ========================================= */

  function getDateKey(
    date = new Date()
  ) {

    const year =
      date.getFullYear();


    const month =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return `${year}-${month}-${day}`;

  }


  function showDate() {

    document
      .getElementById(
        "date"
      )
      .innerText =
      new Date().toLocaleDateString(
        "zh-CN",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        }
      );

  }


  /* =========================================
     今日记录
  ========================================= */

  function getTodayRecords(
    taskId
  ) {

    const today =
      getDateKey();


    return data.history.filter(
      record =>
        record.taskId === taskId &&
        record.date === today
    );

  }


  function getTodayAmountRecords(
    taskId
  ) {

    return getTodayRecords(
      taskId
    ).filter(
      record =>
        record.isAmountRecord === true
    );

  }


  function getTodayAmount(
    taskId
  ) {

    return getTodayAmountRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.amount || 0),
      0
    );

  }


  function getTodayAmountXp(
    taskId
  ) {

    return getTodayAmountRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.xp || 0),
      0
    );

  }


  function getTodayAllXp(
    taskId
  ) {

    return getTodayRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.xp || 0),
      0
    );

  }


  /* =========================================
     格式
  ========================================= */

  function formatNumber(
    value
  ) {

    const number =
      Number(value);


    if (
      Number.isInteger(number)
    ) {

      return number.toString();

    }


    return number
      .toFixed(2)
      .replace(
        /\.?0+$/,
        ""
      );

  }


  function formatAmount(
    amount,
    unit
  ) {

    const number =
      formatNumber(
        amount
      );


    if (
      unit === "$"
    ) {

      return `$${number}`;

    }


    return `${number} ${unit}`;

  }


  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(value);


    return div.innerHTML;

  }


  /* =========================================
     今日任务
  ========================================= */

  function renderTasks() {

    const list =
      document.getElementById(
        "taskList"
      );


    list.innerHTML =
      "";


    if (
      data.tasks.length === 0
    ) {

      list.innerHTML = `
        <div class="empty">
          还没有任务。<br>
          添加你的第一个任务吧 ✨
        </div>
      `;

      return;

    }


    data.tasks.forEach(
      task => {

        const allTodayRecords =
          getTodayRecords(
            task.id
          );


        let detail =
          "";


        let button =
          "";


        if (
          task.scoreMode ===
          "amount"
        ) {

          const amountRecords =
            getTodayAmountRecords(
              task.id
            );


          const amount =
            getTodayAmount(
              task.id
            );


          const amountXp =
            getTodayAmountXp(
              task.id
            );


          if (
            amountRecords.length === 0
          ) {

            detail =
              `今天还没有记录 · 按${escapeHtml(task.unit)}获得 XP`;

          } else {

            detail =
              `今天 ${escapeHtml(
                formatAmount(
                  amount,
                  task.unit
                )
              )} · +${formatNumber(amountXp)} XP`;

          }


          button = `
            <button
              class="plus"
              onclick="startCompletion('${task.id}')"
            >
              +
            </button>
          `;

        } else {

          const todayXp =
            getTodayAllXp(
              task.id
            );


          const completedToday =
            allTodayRecords.length > 0;


          if (
            task.oncePerDay
          ) {

            detail =
              completedToday
                ? `今天已完成 · +${formatNumber(todayXp)} XP`
                : `完成 +${formatNumber(task.fixedXp)} XP`;


            button =
              completedToday
                ? `
                  <button
                    class="plus done"
                    disabled
                  >
                    ✓ 已完成
                  </button>
                `
                : `
                  <button
                    class="plus"
                    onclick="startCompletion('${task.id}')"
                  >
                    +${formatNumber(task.fixedXp)}
                  </button>
                `;

          } else {

            detail =
              allTodayRecords.length === 0
                ? `完成一次 +${formatNumber(task.fixedXp)} XP`
                : `今天完成 ${allTodayRecords.length} 次 · +${formatNumber(todayXp)} XP`;


            button = `
              <button
                class="plus"
                onclick="startCompletion('${task.id}')"
              >
                +${formatNumber(task.fixedXp)}
              </button>
            `;

          }

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "task";


        div.innerHTML = `

          <div class="task-left">

            <div class="emoji">
              ${escapeHtml(task.emoji)}
            </div>

            <div class="task-info">

              <div class="task-name">
                ${escapeHtml(task.name)}
              </div>

              <div class="task-detail">
                ${detail}
              </div>

            </div>

          </div>


          <div class="task-buttons">

            <button
              class="more"
              onclick="openEditModal('${task.id}')"
            >
              •••
            </button>

            ${button}

          </div>

        `;


        list.appendChild(
          div
        );

      }
    );

  }


  /* =========================================
     全局成就系统
  ========================================= */

  function getActiveDateSet() {

    return new Set(
      data.history.map(
        record =>
          record.date
      )
    );

  }


  function getDistinctTaskCount() {

    return new Set(
      data.history.map(
        record =>
          record.taskId
      )
    ).size;

  }


  function getMaxActionsInOneDay() {

    const counts = {};


    data.history.forEach(
      record => {

        counts[record.date] =
          (counts[record.date] || 0) + 1;

      }
    );


    const values =
      Object.values(counts);


    return values.length
      ? Math.max(...values)
      : 0;

  }


  function getAchievementSeries(
    prefix,
    milestones,
    current,
    names,
    icons,
    descriptions
  ) {

    return milestones.map(
      (target, index) => ({

        id:
          `${prefix}-${target}`,

        icon:
          icons[index],

        name:
          names[index],

        description:
          descriptions[index]
            .replace(
              "{target}",
              target.toLocaleString()
            ),

        current:
          current,

        target:
          target,

        unlocked:
          current >= target

      })
    );

  }


  function getGlobalAchievementGroups() {

    const totalXp =

  function checkNewAchievements() {

    const achievements =
      getAllAchievements();


    const newAchievement =
      achievements.find(
        achievement =>
          achievement.unlocked &&
          !data.unlockedAchievements.includes(
            achievement.id

    if (
      !newAchievement

      return;

    }


    data.unlockedAchievements.push(
      newAchievement.id
    );


    saveData();


    showUnlockModal(
      newAchievement
    );

  }

  function startOfDay(
    date
  ) {

    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  }


  function addDays(
    date,
    days
  ) {

    const result =
      new Date(date);


    result.setDate(
      result.getDate() + days
    );


    return result;

  }


  function getStatsRange() {

    const now =
      startOfDay(
        new Date()
      );


    let start;
    let end;
    let label;


    if (
      statsPeriod === "week"
    ) {

      const mondayOffset =
        (now.getDay() + 6) % 7;


      start =
        addDays(
          now,
          -mondayOffset
        );


      end =
        addDays(
          start,
          7
        );


      label =
        "本周";

    } else if (
      statsPeriod === "month"
    ) {

      start =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          1
        );


      end =
        new Date(
          now.getFullYear(),
          now.getMonth() + 1,
          1
        );


      label =
        `${now.getMonth() + 1} 月`;

    } else {

      start =
        new Date(
          now.getFullYear(),
          0,
          1
        );


      end =
        new Date(
          now.getFullYear() + 1,
          0,
          1
        );


      label =
        `${now.getFullYear()} 年`;

    }


    return {
      start,
      end,
      label
    };

  }


  function getRecordsInRange(
    start,
    end
  ) {

    const startKey =
      getDateKey(start);


    const endKey =
      getDateKey(end);


    return data.history.filter(
      record =>
        record.date >= startKey &&
        record.date < endKey

  }

  function getTrendBuckets(
    range,
    records
  ) {

    const buckets =
      [];


    if (
      statsPeriod === "week"
    ) {

      const labels = [
        "一",
        "二",
        "三",
        "四",
        "五",
        "六",
        "日"
      ];


      for (
        let i = 0;
        i < 7;
        i++
      ) {

        const date =
          addDays(
            range.start,
            i
          );


        const key =
          getDateKey(date);


        const xp =
          records
            .filter(
              record =>
                record.date === key
            )
            .reduce(
              (sum, record) =>
                sum +
                Number(record.xp || 0),
              0
            );


        buckets.push({
          label: labels[i],
          xp,
          fullLabel:
            `${date.getMonth() + 1}/${date.getDate()}`
        });

      }


      return buckets;

    }


    if (
      statsPeriod === "month"
    ) {

      const daysInMonth =
        new Date(
          range.start.getFullYear(),
          range.start.getMonth() + 1,
          0
        ).getDate();


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const date =
          new Date(
            range.start.getFullYear(),
            range.start.getMonth(),
            day
          );


        const key =
          getDateKey(date);


        const xp =
          records
            .filter(
              record =>
                record.date === key
            )
            .reduce(
              (sum, record) =>
                sum +
                Number(record.xp || 0),
              0
            );


        buckets.push({
          label:
            day === 1 ||
            day % 5 === 0
              ? String(day)
              : "",
          xp,
          fullLabel:
            `${range.start.getMonth() + 1}/${day}`
        });

      }


      return buckets;

    }


    for (
      let month = 0;
      month < 12;
      month++
    ) {

      const monthStart =
        new Date(
          range.start.getFullYear(),
          month,
          1
        );


      const monthEnd =
        new Date(
          range.start.getFullYear(),
          month + 1,
          1
        );


      const startKey =
        getDateKey(monthStart);


      const endKey =
        getDateKey(monthEnd);


      const xp =
        records
          .filter(
            record =>
              record.date >= startKey &&
              record.date < endKey
          )
          .reduce(
            (sum, record) =>
              sum +
              Number(record.xp || 0),
            0
          );


      buckets.push({
        label:
          `${month + 1}月`,
        xp,
        fullLabel:
          `${month + 1} 月`
      });

    }


    return buckets;

  }


  function renderTrend(
    range,
    records
  ) {

    const buckets =
      getTrendBuckets(
        range,
        records
      );


    const maxXp =
      Math.max(
        1,
        ...buckets.map(
          bucket =>
            bucket.xp
        )
      );


    const chart =
      document.getElementById(
        "trendChart"
      );


    chart.innerHTML =
      buckets.map(
        bucket => {

          const height =
            bucket.xp <= 0
              ? 2
              : Math.max(
                  6,
                  (
                    bucket.xp /
                    maxXp
                  ) * 100
                );


          const showValue =
            bucket.xp > 0 &&
            (
              statsPeriod !== "month" ||
              bucket.xp === maxXp
            );


          return `
            <div
              class="trend-column"
              title="${escapeHtml(bucket.fullLabel)} · ${formatNumber(bucket.xp)} XP"
            >
              <div class="trend-value">
                ${showValue
                  ? formatNumber(bucket.xp)
                  : ""}
              </div>

              <div class="trend-bar-wrap">
                <div
                  class="trend-bar"
                  style="height:${height}%"
                ></div>
              </div>

              <div class="trend-label">
                ${escapeHtml(bucket.label)}
              </div>
            </div>
          `;

        }
      ).join("");


    document
      .getElementById(
        "trendSubtitle"
      )
      .innerText =
      statsPeriod === "year"
        ? "按月查看获得的 XP"
        : "按天查看获得的 XP";


    const best =
      buckets.reduce(
        (best, bucket) =>
          bucket.xp > best.xp
            ? bucket
            : best,
        {
          xp: 0,
          fullLabel: ""
        }
      );


    document
      .getElementById(
        "trendNote"
      )
      .innerText =
      best.xp > 0
        ? `最高：${best.fullLabel} · ${formatNumber(best.xp)} XP`
        : "这段时间还没有 XP 记录";

  }


  function renderTaskStats(
    records
  ) {

    const container =
      document.getElementById(
        "taskStats"
      );


    if (
      records.length === 0
    ) {

      container.innerHTML = `
        <div class="stats-empty-small">
          这段时间还没有任务记录。
        </div>
      `;

      return;

    }


    const grouped = {};


    records.forEach(
      record => {

        if (
          !grouped[record.taskId]
        ) {

          grouped[record.taskId] = [];

        }


        grouped[record.taskId].push(
          record
        );

      }
    );


    const rows =
      Object.entries(grouped)
        .map(
          ([taskId, taskRecords]) => {

            const task =
              data.tasks.find(
                item =>
                  item.id === taskId
              );


            const name =
              task
                ? task.name
                : "已删除的任务";


            const emoji =
              task
                ? task.emoji
                : "⭐";


            const xp =
              taskRecords.reduce(
                (sum, record) =>
                  sum +
                  Number(record.xp || 0),
                0
              );


            const amountRecords =
              taskRecords.filter(
                record =>
                  record.isAmountRecord === true &&
                  Number(record.amount || 0) > 0
              );


            let detail;


            if (
              amountRecords.length > 0
            ) {

              const byUnit = {};


              amountRecords.forEach(
                record => {

                  const unit =
                    record.unit || "单位";


                  byUnit[unit] =
                    (byUnit[unit] || 0) +
                    Number(record.amount || 0);

                }
              );


              const amountText =
                Object.entries(byUnit)
                  .map(
                    ([unit, amount]) =>
                      formatAmount(
                        amount,
                        unit
                      )
                  )
                  .join(" + ");


              detail =
                `${amountText} · ${taskRecords.length} 次记录`;

            } else {

              detail =
                `${taskRecords.length} 次完成`;

            }


            return {
              name,
              emoji,
              xp,
              detail,
              count:
                taskRecords.length
            };

          }
        )
        .sort(
          (a, b) =>
            b.xp - a.xp ||
            b.count - a.count
        );


    container.innerHTML =
      rows.map(
        row => `
          <div class="task-stat-row">

            <div class="task-stat-top">

              <div class="task-stat-name">
                ${escapeHtml(row.emoji)}
                ${escapeHtml(row.name)}
              </div>

              <div class="task-stat-xp">
                +${formatNumber(row.xp)} XP
              </div>

            </div>

            <div class="task-stat-detail">
              ${escapeHtml(row.detail)}
            </div>

          </div>
        `
      ).join("");

  }


  function getEarliestHistoryYear() {

    const years =
      data.history
        .map(
          record =>
            Number(
              String(record.date)
                .slice(0, 4)
            )
        )
        .filter(
          year =>
            Number.isFinite(year)
        );


    return years.length
      ? Math.min(...years)
      : new Date().getFullYear();

  }


  function changeHeatmapYear(
    direction
  ) {

    const currentYear =
      new Date().getFullYear();


    const earliestYear =
      getEarliestHistoryYear();


    heatmapYear =
      Math.max(
        earliestYear,
        Math.min(
          currentYear,
          heatmapYear + direction
        )
      );


    renderHeatmap();

  }


  function renderHeatmap() {

    const currentYear =
      new Date().getFullYear();


    const earliestYear =
      getEarliestHistoryYear();


    /*
      新的一年第一次打开时，
      自动跟随当前年份。
      同一次打开期间如果用户手动翻到旧年份，
      则保留用户正在查看的年份。
    */

    if (
      heatmapYear > currentYear
    ) {

      heatmapYear =
        currentYear;

    }


    if (
      heatmapYear < earliestYear
    ) {

      heatmapYear =
        earliestYear;

    }


    document
      .getElementById(
        "heatmapYear"
      )
      .innerText =
      `${heatmapYear} 年`;


    document
      .getElementById(
        "prevHeatmapYear"
      )
      .disabled =
      heatmapYear <= earliestYear;


    document
      .getElementById(
        "nextHeatmapYear"
      )
      .disabled =
      heatmapYear >= currentYear;


    const counts = {};


    data.history.forEach(
      record => {

        if (
          record.date.startsWith(
            `${heatmapYear}-`
          )
        ) {

          counts[record.date] =
            (counts[record.date] || 0) + 1;

        }

      }
    );


    const maxCount =
      Math.max(
        1,
        ...Object.values(counts)
      );


    const start =
      new Date(
        heatmapYear,
        0,
        1
      );


    const end =
      new Date(
        heatmapYear + 1,
        0,
        1
      );


    const mondayOffset =
      (start.getDay() + 6) % 7;


    const gridStart =
      addDays(
        start,
        -mondayOffset
      );


    let html =
      "";


    for (
      let date = new Date(gridStart);
      date < end;
      date = addDays(date, 1)
    ) {

      const key =
        getDateKey(date);


      const isTargetYear =
        date.getFullYear() ===
        heatmapYear;


      const count =
        isTargetYear
          ? (counts[key] || 0)
          : 0;


      let level =
        0;


      if (
        count > 0
      ) {

        const ratio =
          count / maxCount;


        if (
          ratio <= .25
        ) {
          level = 1;
        } else if (
          ratio <= .5
        ) {
          level = 2;
        } else if (
          ratio <= .75
        ) {
          level = 3;
        } else {
          level = 4;
        }

      }


      html += `
        <div
          class="heat-cell ${level ? `level-${level}` : ""}"
          title="${key} · ${count} 次行动"
          style="${isTargetYear ? "" : "visibility:hidden;"}"
        ></div>
      `;

    }


    document
      .getElementById(
        "heatmap"
      )
      .innerHTML =
      html;

  }


  function renderStats() {

    if (

        getTodayRecords(
          task.id

        return;

      recordCompletion(

        false

      return;

      task.id;


    document

        "completeEmoji"

        "completeName"

  function calculateAmountXp(
    task,
    amount
  ) {

    return (
      Number(amount) /
      Number(task.amountBase)
    )
    *
    Number(task.xpPerBase);

  }

    task,

    xp,

      task.oncePerDay &&
      getTodayRecords(task.id).length > 0
    ) {

        "今天已经完成啦 ✓"
      );

      return;

    }


    const recordId =
      makeId();


    data.history.push({

      id:
        recordId,

      taskId:
        task.id,

      date:
        getDateKey(),

      timestamp:
        new Date().toISOString(),

      xp:
        Number(xp),

      amount:
        amount,

      unit:
        isAmountRecord
          ? task.unit
          : "",

      scoreMode:
        task.scoreMode,

      isAmountRecord:
        isAmountRecord

    });


    saveData();

    render();


    let message =
      `${task.emoji} `;


    if (
      isAmountRecord
    ) {

      message +=
        `${formatAmount(
          amount,
          task.unit
        )} · `;

    }


    message +=
      `+${formatNumber(xp)} XP · 点击撤销`;


    showToast(
      message,

      function () {

        undoRecord(
          recordId
        );

      }
    );

  function getTotalXp() {

      (total, record) =>

      0
    );

  function calculateLevel(
    totalXp
  ) {

    let level =
      1;


    let remaining =
      totalXp;


    let needed =
      100;


    while (
      remaining >= needed
    ) {

      remaining -=
        needed;


      level++;


      needed =
        100 +
        (level - 1) * 50;

    }


    return {

      level:
        level,

      currentXp:
        remaining,

      neededXp:
        needed

    };

  }


  function renderLevel() {

    const totalXp =
      getTotalXp();


    const result =
      calculateLevel(
        totalXp
      );


    document
      .getElementById(
        "level"

      .innerText =
      `Lv. ${result.level}`;


    document
      .getElementById(
        "xpDisplay"
      )
      .innerText =
      `${formatNumber(result.currentXp)} / ${formatNumber(result.neededXp)} XP`;


    document
      .getElementById(
        "totalXp"
      )
      .innerText =
      `累计获得 ${formatNumber(totalXp)} XP`;


    const percent =
      Math.min(
        100,
        (
          result.currentXp /
          result.neededXp
        ) * 100
      );


    document
      .getElementById(
        "progressBar"
      )
      .style.width =
      percent + "%";

  }


  /* =========================================
     连续坚持
  ========================================= */

  function calculateStreak() {

    if (
      data.history.length === 0
    ) {

      return 0;

    }


    const dates =
      new Set(
        data.history.map(
          record =>
            record.date
        )
      );


    let cursor =
      new Date();


    let streak =
      0;


    if (
      !dates.has(
        getDateKey(cursor)
      )
    ) {

      cursor.setDate(
        cursor.getDate() - 1
      );

    }


    while (
      dates.has(
        getDateKey(cursor)
      )
    ) {

      streak++;


      cursor.setDate(
        cursor.getDate() - 1
      );

    }


    return streak;

  }

    document
      .getElementById(
        "streak"

      .innerText =

  /* =========================================
     撤销最近一次
  ========================================= */

  function undoRecentTask() {

    if (!editingTaskId) {
      return;
    }


    const task =
      data.tasks.find(
        task =>
          task.id ===
          editingTaskId
      );


    if (!task) {
      return;
    }


    let lastIndex =
      -1;


    let newestTime =
      -Infinity;


    data.history.forEach(
      (record, index) => {

        if (
          record.taskId !==
          editingTaskId
        ) {
          return;
        }


        const time =
          new Date(
            record.timestamp
          ).getTime();


        if (
          time > newestTime
        ) {

          newestTime =
            time;

          lastIndex =
            index;

        }

      }
    );


    if (
      lastIndex === -1
    ) {

      alert(
        "这个任务还没有完成记录。"
      );

      return;

    }


    const record =
      data.history[
        lastIndex
      ];


    let text =
      `日期：${record.date}\n`;


    if (
      record.isAmountRecord === true &&
      record.amount !== null
    ) {

      text +=
        `完成量：${formatAmount(
          record.amount,
          record.unit || task.unit
        )}\n`;

    }


    text +=
      `XP：${formatNumber(record.xp)}`;


    const confirmed =
      confirm(
        `确定撤销「${task.name}」最近的一次记录吗？\n\n${text}`
      );


    if (!confirmed) {
      return;
    }


    data.history.splice(
      lastIndex,
      1
    );


    saveData();

    closeTaskModal();

    render();


    showToast(
      "↩️ 已撤销最近一次完成"
    );

  }

  /* =========================================

  let toastTimer =

  let toastAction =
    null;


  function showToast(
    message,
    action = null
  ) {

    const toast =
      document.getElementById(
        "toast"
      );


    clearTimeout(
      toastTimer
    );


    toast.innerText =
      message;


    toastAction =
      action;


    toast.classList.add(
      "show"
    );


    toast.classList.toggle(
      "clickable",
      !!action
    );


    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            "show",
            "clickable"
          );


          toastAction =
            null;

        },
        3500
      );

  }


  document
    .getElementById(
      "toast"
    )
    .addEventListener(
      "click",
      function () {

        if (!toastAction) {
          return;
        }


        const action =
          toastAction;


        toastAction =
          null;


        clearTimeout(
          toastTimer
        );


        this.classList.remove(
          "show",
          "clickable"
        );


        action();

      }
    );

      updateXpPreview
    );


  document
    .getElementById(
      "completeAmount"
    )
    .addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Enter"
        ) {

          confirmAmountCompletion();

        }

      }
    );


  document
    .getElementById(
      "customUnit"
    )
    .addEventListener(
      "input",
      updateCustomUnit
    );


  document
    .getElementById(
      "taskModal"
    )
    .addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          this
        ) {

          closeTaskModal();

        }

      }
    );


  document
    .getElementById(
      "amountModal"
    )
    .addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          this
        ) {

          closeAmountModal();

        }

      }
    );


  document
    .getElementById(
      "clearTodayModal"
    )
    .addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          this
        ) {

          closeClearTodayModal();

        }

      }
    );


  document
    .getElementById(
      "unlockModal"
    )
    .addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          this
        ) {

          closeUnlockModal();

        }

      }
    );


  /* =========================================
     总刷新
  ========================================= */

  function render() {

    showDate();

    renderTasks();

    renderLevel();

    renderStreak();


    if (
      currentPage ===
      "achievement"
    ) {

      renderAchievements();

    }


    if (
      currentPage ===
      "stats"
    ) {

      renderStats();

    }

  }


  render();

</script>
