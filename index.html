<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Life Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 28px 20px 120px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .date {
      color: #888;
      font-size: 14px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 30px;
    }

    /* =========================
       等级
    ========================= */

    .level-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .05);
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .progress {
      height: 10px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #222;
      border-radius: 10px;
      transition: width .3s ease;
    }

    .total-xp {
      margin-top: 10px;
      color: #999;
      font-size: 12px;
    }

    /* =========================
       今日任务
    ========================= */

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
    }

    .clear-today {
      border: none;
      background: transparent;
      color: #999;
      font-size: 12px;
      cursor: pointer;
      padding: 6px;
    }

    .task {
      background: white;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .04);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .emoji {
      font-size: 28px;
      width: 38px;
      text-align: center;
      flex-shrink: 0;
    }

    .task-info {
      min-width: 0;
    }

    .task-name {
      font-weight: 650;
      word-break: break-word;
    }

    .task-detail {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .task-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .more {
      border: none;
      background: #f1f1f3;
      color: #777;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
    }

    .plus {
      border: none;
      background: #222;
      color: white;
      min-width: 54px;
      height: 50px;
      padding: 0 13px;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .plus:active {
      transform: scale(.94);
    }

    .plus.done {
      min-width: 88px;
      background: #e8e8ea;
      color: #777;
      font-size: 13px;
      cursor: default;
    }

    .add-task {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      border: 2px dashed #ccc;
      background: transparent;
      border-radius: 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .streak {
      text-align: center;
      margin-top: 28px;
      font-weight: 650;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      color: #999;
      text-align: center;
    }

    /* =========================
       成就页面
    ========================= */

    .achievement-header {
      margin-bottom: 22px;
    }

    .achievement-header h1 {
      margin-bottom: 6px;
    }

    .achievement-subtitle {
      color: #999;
      font-size: 14px;
    }

    .achievement-summary {
      background: #222;
      color: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .achievement-summary-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .achievement-summary-label {
      font-size: 13px;
      opacity: .7;
      margin-bottom: 5px;
    }

    .achievement-summary-number {
      font-size: 30px;
      font-weight: 800;
    }

    .achievement-summary-percent {
      font-size: 14px;
      opacity: .75;
    }

    .achievement-summary .progress {
      background: rgba(255,255,255,.18);
    }

    .achievement-summary .progress-bar {
      background: white;
    }

    .achievement-group {
      margin-bottom: 28px;
    }

    .achievement-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .achievement-card {
      background: white;
      border-radius: 17px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      gap: 13px;
      align-items: center;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .035);
    }

    .achievement-card.locked {
      opacity: .55;
    }

    .achievement-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #f2f2f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .achievement-card.unlocked .achievement-icon {
      background: #222;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
    }

    .achievement-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .achievement-desc {
      color: #999;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .achievement-progress-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .achievement-mini-progress {
      height: 6px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      flex: 1;
    }

    .achievement-mini-bar {
      height: 100%;
      background: #222;
      border-radius: 10px;
    }

    .achievement-progress-text {
      font-size: 11px;
      color: #999;
      min-width: 58px;
      text-align: right;
    }

    .unlocked-badge {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       底部导航
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, .96);
      display: flex;
      justify-content: space-around;
      padding: 16px 10px 24px;
      border-top: 1px solid #eee;
      z-index: 10;
    }

    .nav-item {
      color: #999;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .nav-item.active {
      color: #222;
      font-weight: 700;
    }

    /* =========================
       弹窗
    ========================= */

    .modal-bg {
      display: none;
      position: fixed;
      z-index: 20;
      inset: 0;
      background: rgba(0, 0, 0, .38);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 24px;
    }

    .modal h2 {
      margin: 0 0 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      background: white;
    }

    .setting-card {
      background: #f7f7f9;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 16px;
    }

    .setting-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .choice-row {
      display: flex;
      gap: 8px;
    }

    .choice {
      flex: 1;
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: block;
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 11px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .choice input:checked + label {
      background: #222;
      color: white;
      border-color: #222;
    }

    .help {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .fixed-settings,
    .amount-settings {
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .custom-unit {
      display: none;
      margin-top: 10px;
    }

    .custom-unit.show {
      display: block;
    }

    .xp-equation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .xp-equation input {
      width: 75px;
      text-align: center;
    }

    .xp-equation span {
      font-size: 14px;
      white-space: nowrap;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 13px;
      padding: 13px;
      cursor: pointer;
    }

    .btn-light {
      background: #eee;
    }

    .btn-dark {
      background: #222;
      color: white;
    }

    .undo-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      margin-top: 12px;
      background: #f1f1f3;
      color: #333;
      cursor: pointer;
    }

    .btn-danger {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px;
      margin-top: 10px;
      background: #fff0f0;
      color: #c73535;
      cursor: pointer;
    }

    /* =========================
       完成量弹窗
    ========================= */

    .complete-icon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 6px;
    }

    .complete-name {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 22px;
    }

    .amount-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount-input-wrap input {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .amount-unit {
      min-width: 55px;
      font-weight: 650;
    }

    .xp-preview {
      text-align: center;
      font-weight: 700;
      margin: 18px 0 5px;
      font-size: 17px;
    }

    /* =========================
       撤销今日
    ========================= */

    .clear-icon {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .clear-title {
      text-align: center;
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    .clear-summary {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .today-records {
      background: #f7f7f9;
      border-radius: 15px;
      padding: 12px 14px;
      max-height: 220px;
      overflow-y: auto;
    }

    .today-record {
      padding: 8px 0;
      border-bottom: 1px solid #e8e8ea;
      font-size: 13px;
      line-height: 1.5;
    }

    .today-record:last-child {
      border-bottom: none;
    }

    /* =========================
       成就解锁弹窗
    ========================= */

    .unlock-modal {
      text-align: center;
    }

    .unlock-sparkle {
      font-size: 16px;
      color: #999;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .unlock-icon {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .unlock-label {
      font-size: 12px;
      color: #999;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .unlock-name {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .unlock-desc {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* =========================
       Toast
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 11px 18px;
      border-radius: 30px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 30;
      white-space: nowrap;
      max-width: calc(100% - 30px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.clickable {
      pointer-events: auto;
      cursor: pointer;
    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       今日页面
  ========================= -->

  <div class="page active" id="todayPage">

    <div class="date" id="date"></div>

    <h1>✨ TODAY</h1>


    <div class="level-card">

      <div class="level-row">

        <span id="level">
          Lv. 1
        </span>

        <span id="xpDisplay">
          0 / 100 XP
        </span>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>


      <div
        class="total-xp"
        id="totalXp"
      >
        累计获得 0 XP
      </div>

    </div>


    <div class="section-header">

      <div class="section-title">
        今日任务
      </div>


      <button
        class="clear-today"
        onclick="openClearTodayModal()"
      >
        ↩ 撤销今日记录
      </button>

    </div>


    <div id="taskList"></div>


    <button
      class="add-task"
      onclick="openAddModal()"
    >
      ＋ 添加任务
    </button>


    <div
      class="streak"
      id="streak"
    >
      🔥 连续坚持 0 天
    </div>

  </div>


  <!-- =========================
       成就页面
  ========================= -->

  <div
    class="page"
    id="achievementPage"
  >

    <div class="achievement-header">

      <h1>🏆 成就</h1>

      <div class="achievement-subtitle">
        你的每一点行动都会留下记录。
      </div>

    </div>


    <div
      class="achievement-summary"
      id="achievementSummary"
    ></div>


    <div id="achievementList"></div>

  </div>


  <!-- =========================
       统计页面占位
  ========================= -->

  <div
    class="page"
    id="statsPage"
  >

    <h1>📊 统计</h1>

    <div class="empty">
      统计页面下一步来做。
    </div>

  </div>

</div>


<!-- =========================
     底部导航
========================= -->

<div class="bottom-nav">

  <button
    class="nav-item active"
    id="todayNav"
    onclick="switchPage('today')"
  >
    🏠 今日
  </button>


  <button
    class="nav-item"
    id="achievementNav"
    onclick="switchPage('achievement')"
  >
    🏆 成就
  </button>


  <button
    class="nav-item"
    id="statsNav"
    onclick="switchPage('stats')"
  >
    📊 统计
  </button>

</div>


<!-- =========================
     创建 / 编辑任务
========================= -->

<div
  class="modal-bg"
  id="taskModal"
>

  <div class="modal">

    <h2 id="modalTitle">
      创建任务
    </h2>


    <div class="field">

      <label>
        任务名称
      </label>

      <input
        id="taskName"
        type="text"
        placeholder="例如：打扫卫生"
      >

    </div>


    <div class="field">

      <label>
        图标 Emoji
      </label>

      <input
        id="taskEmoji"
        type="text"
        value="⭐"
      >

    </div>


    <div class="setting-card">

      <div class="setting-title">
        怎么获得 XP？
      </div>


      <div class="choice-row">

        <div class="choice">

          <input
            type="radio"
            name="scoreMode"
            id="modeFixed"
            value="fixed"
            checked
            onchange="updateScoreMode()"
          >

          <label for="modeFixed">
            ✓ 完成任务
          </label>

        </div>


        <div class="choice">

          <input
            type="radio"
            name="scoreMode"
            id="modeAmount"
            value="amount"
            onchange="updateScoreMode()"
          >

          <label for="modeAmount">
            ⏱ 按完成量
          </label>

        </div>

      </div>


      <div
        class="fixed-settings"
        id="fixedSettings"
      >

        <div class="field">

          <label>
            完成一次获得多少 XP？
          </label>

          <input
            id="fixedXp"
            type="number"
            value="5"
            min="0.1"
            step="any"
          >

        </div>


        <label class="checkbox-row">

          <input
            id="oncePerDay"
            type="checkbox"
          >

          每天只能完成一次

        </label>

      </div>


      <div
        class="amount-settings hidden"
        id="amountSettings"
      >

        <div class="field">

          <label>
            用什么单位记录？
          </label>

          <select
            id="amountUnit"
            onchange="updateCustomUnit()"
          >

            <option value="分钟">分钟</option>
            <option value="小时">小时</option>
            <option value="页">页</option>
            <option value="件">件</option>
            <option value="个">个</option>
            <option value="ml">ml</option>
            <option value="miles">miles</option>
            <option value="$">$</option>

            <option value="custom">
              自定义...
            </option>

          </select>


          <input
            class="custom-unit"
            id="customUnit"
            type="text"
            placeholder="例如：单词"
          >

        </div>


        <div class="field">

          <label>
            XP 换算
          </label>


          <div class="xp-equation">

            <span>每</span>

            <input
              id="amountBase"
              type="number"
              value="1"
              min="0.01"
              step="any"
            >

            <span id="unitPreview">
              分钟
            </span>

            <span>=</span>

            <input
              id="xpPerBase"
              type="number"
              value="1"
              min="0.01"
              step="any"
            >

            <span>XP</span>

          </div>


          <div class="help">
            例如：每 1 分钟 = 1 XP，
            打扫 7 分钟就获得 7 XP。
          </div>

        </div>

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeTaskModal()"
      >
        取消
      </button>


      <button
        class="btn btn-dark"
        onclick="saveTask()"
      >
        保存
      </button>

    </div>


    <button
      class="undo-button"
      id="undoTaskButton"
      onclick="undoRecentTask()"
      style="display:none;"
    >
      ↩️ 撤销最近一次完成
    </button>


    <button
      class="btn-danger"
      id="deleteButton"
      onclick="deleteTask()"
      style="display:none;"
    >
      🗑 删除这个任务
    </button>

  </div>

</div>


<!-- =========================
     按完成量弹窗
========================= -->

<div
  class="modal-bg"
  id="amountModal"
>

  <div class="modal">

    <div
      class="complete-icon"
      id="completeEmoji"
    >
      🧹
    </div>


    <div
      class="complete-name"
      id="completeName"
    >
      打扫卫生
    </div>


    <div class="field">

      <label>
        这次完成了多少？
      </label>


      <div class="amount-input-wrap">

        <input
          id="completeAmount"
          type="number"
          min="0"
          step="any"
        >

        <span
          class="amount-unit"
          id="completeUnit"
        >
          分钟
        </span>

      </div>

    </div>


    <div
      class="xp-preview"
      id="xpPreview"
    >
      获得 +0 XP
    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeAmountModal()"
      >
        取消
      </button>


      <button
        class="btn btn-dark"
        onclick="confirmAmountCompletion()"
      >
        完成
      </button>

    </div>

  </div>

</div>


<!-- =========================
     撤销今日
========================= -->

<div
  class="modal-bg"
  id="clearTodayModal"
>

  <div class="modal">

    <div class="clear-icon">
      ↩️
    </div>


    <div class="clear-title">
      撤销今天所有行动？
    </div>


    <div
      class="clear-summary"
      id="clearTodaySummary"

        取消

>

      ✦ ACHIEVEMENT ✦
    </div>


    <div

    >
      🏆
    </div>


    <div class="unlock-label">
      成就解锁
    </div>


    <div

    ></div>


    <div

    ></div>

    >
      收下成就
    </button>

<div
  class="toast"
  id="toast"
></div>


<script>

  /* =========================================
     数据
  ========================================= */

  const STORAGE_KEY =
    "myLifeGameDataV2";


  let data =
    loadData();


  let editingTaskId =
    null;


  let completingTaskId =
    null;


  let currentPage =
    "today";


  function makeId() {

    return (
      Date.now().toString(36)
      +
      Math.random().toString(36).slice(2)
    );

  }


  function defaultData() {

    return {

      tasks: [],

      history: [],

      unlockedAchievements: []

    };

  }


  function loadData() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    let loaded;


    if (saved) {

      try {

        loaded =
          JSON.parse(saved);

      } catch (error) {

        console.error(
          "读取数据失败",
          error
        );

      }

    }


    if (!loaded) {

      loaded =
        defaultData();

    }


    loaded.tasks =
      Array.isArray(loaded.tasks)
        ? loaded.tasks
        : [];


    loaded.history =
      Array.isArray(loaded.history)
        ? loaded.history
        : [];


    if (
      !Array.isArray(
        loaded.unlockedAchievements
      )
    ) {

      loaded.unlockedAchievements =
        [];

    }


    loaded.tasks.forEach(
      task => {

        if (!task.scoreMode) {
          task.scoreMode = "fixed";
        }


        if (
          typeof task.fixedXp !==
          "number"
        ) {

          task.fixedXp =
            Number(task.xp || 5);

        }


        if (
          typeof task.oncePerDay !==
          "boolean"
        ) {

          task.oncePerDay =
            typeof task.repeatable === "boolean"
              ? !task.repeatable
              : false;

        }


        if (
          typeof task.unit !==
          "string"
        ) {

          task.unit = "";

        }


        if (
          typeof task.amountBase !==
          "number"
        ) {

          task.amountBase = 1;

        }


        if (
          typeof task.xpPerBase !==
          "number"
        ) {

          task.xpPerBase = 1;

        }

      }
    );


    loaded.history.forEach(
      record => {

        if (
          !("amount" in record)
        ) {

          if (
            record.quantity !== null &&
            record.quantity !== undefined
          ) {

            record.amount =
              Number(record.quantity);

          } else {

            record.amount =
              null;

          }

        }


        if (
          !("unit" in record)
        ) {

          record.unit = "";

        }


        if (
          typeof record.isAmountRecord !==
          "boolean"
        ) {

          record.isAmountRecord =
            (
              record.amount !== null &&
              record.amount !== undefined &&
              Number(record.amount) > 0
            );

        }

      }
    );


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(loaded)
    );


    return loaded;

  }


  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }


  /* =========================================
     页面切换
  ========================================= */

  function switchPage(
    page
  ) {

    currentPage =
      page;


    document
      .querySelectorAll(
        ".page"
      )
      .forEach(
        element =>
          element.classList.remove(
            "active"
          )
      );


    document
      .querySelectorAll(
        ".nav-item"
      )
      .forEach(
        element =>
          element.classList.remove(
            "active"
          )
      );


    if (
      page === "today"
    ) {

      document
        .getElementById(
          "todayPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "todayNav"
        )
        .classList.add(
          "active"
        );

    }


    if (
      page === "achievement"
    ) {

      document
        .getElementById(
          "achievementPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "achievementNav"
        )
        .classList.add(
          "active"
        );


      renderAchievements();

    }


    if (
      page === "stats"
    ) {

      document
        .getElementById(
          "statsPage"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "statsNav"
        )
        .classList.add(
          "active"
        );

    }


    window.scrollTo(
      0,
      0
    );

  }


  /* =========================================
     日期
  ========================================= */

  function getDateKey(
    date = new Date()
  ) {

    const year =
      date.getFullYear();


    const month =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return `${year}-${month}-${day}`;

  }


  function showDate() {

    document
      .getElementById(
        "date"
      )
      .innerText =
      new Date().toLocaleDateString(
        "zh-CN",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        }
      );

  }


  /* =========================================
     今日记录
  ========================================= */

  function getTodayRecords(
    taskId
  ) {

    const today =
      getDateKey();


    return data.history.filter(
      record =>
        record.taskId === taskId &&
        record.date === today
    );

  }


  function getTodayAmountRecords(
    taskId
  ) {

    return getTodayRecords(
      taskId
    ).filter(
      record =>
        record.isAmountRecord === true
    );

  }


  function getTodayAmount(
    taskId
  ) {

    return getTodayAmountRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.amount || 0),
      0
    );

  }


  function getTodayAmountXp(
    taskId
  ) {

    return getTodayAmountRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.xp || 0),
      0
    );

  }


  function getTodayAllXp(
    taskId
  ) {

    return getTodayRecords(
      taskId
    ).reduce(
      (total, record) =>
        total +
        Number(record.xp || 0),
      0
    );

  }


  /* =========================================
     格式
  ========================================= */

  function formatNumber(
    value
  ) {

    const number =
      Number(value);


    if (
      Number.isInteger(number)
    ) {

      return number.toString();

    }


    return number
      .toFixed(2)
      .replace(
        /\.?0+$/,
        ""
      );

  }


  function formatAmount(
    amount,
    unit
  ) {

    const number =
      formatNumber(
        amount
      );


    if (
      unit === "$"
    ) {

      return `$${number}`;

    }


    return `${number} ${unit}`;

  }


  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(value);


    return div.innerHTML;

  }


  /* =========================================
     今日任务
  ========================================= */

  function renderTasks() {

    const list =
      document.getElementById(
        "taskList"
      );


    list.innerHTML =
      "";


    if (
      data.tasks.length === 0
    ) {

      list.innerHTML = `
        <div class="empty">
          还没有任务。<br>
          添加你的第一个任务吧 ✨
        </div>
      `;

      return;

    }


    data.tasks.forEach(
      task => {

        const allTodayRecords =
          getTodayRecords(
            task.id
          );


        let detail =
          "";


        let button =
          "";


        if (
          task.scoreMode ===
          "amount"
        ) {

          const amountRecords =
            getTodayAmountRecords(
              task.id
            );


          const amount =
            getTodayAmount(
              task.id
            );


          const amountXp =
            getTodayAmountXp(
              task.id
            );


          if (
            amountRecords.length === 0
          ) {

            detail =
              `今天还没有记录 · 按${escapeHtml(task.unit)}获得 XP`;

          } else {

            detail =
              `今天 ${escapeHtml(
                formatAmount(
                  amount,
                  task.unit
                )
              )} · +${formatNumber(amountXp)} XP`;

          }


          button = `
            <button
              class="plus"
              onclick="startCompletion('${task.id}')"
            >
              +
            </button>
          `;

        } else {

          const todayXp =
            getTodayAllXp(
              task.id
            );


          const completedToday =
            allTodayRecords.length > 0;


          if (
            task.oncePerDay
          ) {

            detail =
              completedToday
                ? `今天已完成 · +${formatNumber(todayXp)} XP`
                : `完成 +${formatNumber(task.fixedXp)} XP`;


            button =
              completedToday
                ? `
                  <button
                    class="plus done"
                    disabled
                  >
                    ✓ 已完成
                  </button>
                `
                : `
                  <button
                    class="plus"
                    onclick="startCompletion('${task.id}')"
                  >
                    +${formatNumber(task.fixedXp)}
                  </button>
                `;

          } else {

            detail =
              allTodayRecords.length === 0
                ? `完成一次 +${formatNumber(task.fixedXp)} XP`
                : `今天完成 ${allTodayRecords.length} 次 · +${formatNumber(todayXp)} XP`;


            button = `
              <button
                class="plus"
                onclick="startCompletion('${task.id}')"
              >
                +${formatNumber(task.fixedXp)}
              </button>
            `;

          }

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "task";


        div.innerHTML = `

          <div class="task-left">

            <div class="emoji">
              ${escapeHtml(task.emoji)}
            </div>

            <div class="task-info">

              <div class="task-name">
                ${escapeHtml(task.name)}
              </div>

              <div class="task-detail">
                ${detail}
              </div>

            </div>

          </div>


          <div class="task-buttons">

            <button
              class="more"
              onclick="openEditModal('${task.id}')"
            >
              •••
            </button>

            ${button}

          </div>

        `;


        list.appendChild(
          div
        );

      }
    );

  }


  /* =========================================
     成就系统
  ========================================= */

  function getTaskRecords(
    taskId
  ) {

    return data.history.filter(
      record =>
        record.taskId === taskId
    );

  }


  function getTaskAmount(
    taskId
  ) {

    return getTaskRecords(
      taskId
    )
      .filter(
        record =>
          record.isAmountRecord === true
      )
      .reduce(
        (total, record) =>
          total +
          Number(record.amount || 0),
        0
      );

  }


  /*
    每个任务自动生成“完成次数”成就。
  */

  function getTaskCountAchievements(
    task
  ) {

    const milestones = [
      {
        target: 1,
        icon: "🌱",
        name: "迈出第一步"
      },
      {
        target: 5,
        icon: "✨",
        name: "渐入佳境"
      },
      {
        target: 20,
        icon: "🔥",
        name: "坚持不懈"
      },
      {
        target: 50,
        icon: "🏅",
        name: "熟能生巧"
      },
      {
        target: 100,
        icon: "👑",
        name: "百次达成"
      }
    ];


    const count =
      getTaskRecords(
        task.id
      ).length;


    return milestones.map(
      item => ({

        id:
          `task-count-${task.id}-${item.target}`,

        icon:
          item.icon,

        name:
          item.name,

        description:
          `完成「${task.name}」${item.target} 次`,

        current:
          count,

        target:
          item.target,

        unlocked:
          count >= item.target

      })
    );

  }


  /*
    按量任务再自动生成“累计完成量”成就。

    阶段会根据单位稍微智能一点。
  */

  function getAmountMilestones(
    unit
  ) {

    if (
      unit === "分钟"
    ) {

      return [
        30,
        60,
        300,
        1000
      ];

    }


    if (
      unit === "小时"
    ) {

      return [
        1,
        5,
        20,
        50
      ];

    }


    if (
      unit === "页"
    ) {

      return [
        50,
        200,
        500,
        1000
      ];

    }


    if (
      unit === "件"
    ) {

      return [
        5,
        20,
        50,
        100
      ];

    }


    if (
      unit === "miles"
    ) {

      return [
        5,
        25,
        100,
        300
      ];

    }


    if (
      unit === "$"
    ) {

      return [
        100,
        500,
        1000,
        5000
      ];

    }


    return [
      10,
      50,
      100,
      500
    ];

  }


  function getTaskAmountAchievements(
    task
  ) {

    if (
      task.scoreMode !==
      "amount"
    ) {

      return [];

    }


    const milestones =
      getAmountMilestones(
        task.unit
      );


    const amount =
      getTaskAmount(
        task.id
      );


    const names = [
      "积少成多",
      "小有成果",
      "持续积累",
      "里程碑"
    ];


    const icons = [
      "⏱️",
      "💫",
      "🚀",
      "🏆"
    ];


    return milestones.map(
      (target, index) => ({

        id:
          `task-amount-${task.id}-${target}`,

        icon:
          icons[index],

        name:
          names[index],

        description:
          `累计「${task.name}」${formatAmount(target, task.unit)}`,

        current:
          amount,

        target:
          target,

        unit:
          task.unit,

        unlocked:
          amount >= target

      })
    );

  }


  /*
    全局成就
  */

  function getGlobalAchievements() {

    const totalXp =
      getTotalXp();


    const totalActions =
      data.history.length;


    const streak =
      calculateStreak();


    return [

      {
        id: "global-action-1",
        icon: "🌟",
        name: "游戏开始",
        description: "完成第一次行动",
        current: totalActions,
        target: 1,
        unlocked:
          totalActions >= 1
      },

      {
        id: "global-action-10",
        icon: "🎯",
        name: "行动派",
        description: "累计完成 10 次行动",
        current: totalActions,
        target: 10,
        unlocked:
          totalActions >= 10
      },

      {
        id: "global-action-100",
        icon: "💯",
        name: "百次行动",
        description: "累计完成 100 次行动",
        current: totalActions,
        target: 100,
        unlocked:
          totalActions >= 100
      },

      {
        id: "global-xp-100",
        icon: "⚡",
        name: "能量初现",
        description: "累计获得 100 XP",
        current: totalXp,
        target: 100,
        unlocked:
          totalXp >= 100
      },

      {
        id: "global-xp-500",
        icon: "💎",
        name: "经验猎人",
        description: "累计获得 500 XP",
        current: totalXp,
        target: 500,
        unlocked:
          totalXp >= 500
      },

      {
        id: "global-xp-1000",
        icon: "👑",
        name: "千点经验",
        description: "累计获得 1,000 XP",
        current: totalXp,
        target: 1000,
        unlocked:
          totalXp >= 1000
      },

      {
        id: "global-streak-3",
        icon: "🔥",
        name: "三日连击",
        description: "连续行动 3 天",
        current: streak,
        target: 3,
        unlocked:
          streak >= 3
      },

      {
        id: "global-streak-7",
        icon: "🔥",
        name: "一周坚持",
        description: "连续行动 7 天",
        current: streak,
        target: 7,
        unlocked:
          streak >= 7
      },

      {
        id: "global-streak-30",
        icon: "🏆",
        name: "月度坚持者",
        description: "连续行动 30 天",
        current: streak,
        target: 30,
        unlocked:
          streak >= 30
      }

    ];

  }


  function getAllAchievements() {

    let achievements =
      [];


    achievements.push(
      ...getGlobalAchievements()
    );


    data.tasks.forEach(
      task => {

        achievements.push(
          ...getTaskCountAchievements(
            task
          )
        );


        achievements.push(
          ...getTaskAmountAchievements(
            task
          )
        );

      }
    );


    return achievements;

  }


  /*
    记录已经真正解锁过的成就。

    这样以后即使撤销一条记录，
    也不会再次疯狂弹出同一个成就。
  */

  function checkNewAchievements() {

    const achievements =
      getAllAchievements();


    const newAchievement =
      achievements.find(
        achievement =>
          achievement.unlocked &&
          !data.unlockedAchievements.includes(
            achievement.id
          )
      );


    if (
      !newAchievement
    ) {

      return;

    }


    data.unlockedAchievements.push(
      newAchievement.id
    );


    saveData();


    showUnlockModal(
      newAchievement
    );

  }


  function showUnlockModal(
    achievement
  ) {

    document
      .getElementById(
        "unlockIcon"
      )
      .innerText =
      achievement.icon;


    document
      .getElementById(
        "unlockName"
      )
      .innerText =
      achievement.name;


    document
      .getElementById(
        "unlockDesc"
      )
      .innerText =
      achievement.description;


    document
      .getElementById(
        "unlockModal"
      )
      .classList.add(
        "show"
      );

  }


  function closeUnlockModal() {

    document
      .getElementById(
        "unlockModal"
      )
      .classList.remove(
        "show"
      );


    /*
      如果一次行动同时解锁多个成就，
      收下第一个后继续检查。
    */

    setTimeout(
      checkNewAchievements,
      150
    );

  }


  function renderAchievementCard(
    achievement
  ) {

    const percent =
      Math.min(
        100,
        (
          achievement.current /
          achievement.target
        ) * 100
      );


    const currentText =
      achievement.unit
        ? formatAmount(
            achievement.current,
            achievement.unit
          )
        : formatNumber(
            achievement.current
          );


    const targetText =
      achievement.unit
        ? formatAmount(
            achievement.target,
            achievement.unit
          )
        : formatNumber(
            achievement.target
          );


    return `

      <div
        class="achievement-card
        ${achievement.unlocked ? "unlocked" : "locked"}"
      >

        <div class="achievement-icon">
          ${achievement.unlocked
            ? achievement.icon
            : "🔒"}
        </div>


        <div class="achievement-info">

          <div class="achievement-name">
            ${escapeHtml(
              achievement.name
            )}
          </div>


          <div class="achievement-desc">
            ${escapeHtml(
              achievement.description
            )}
          </div>


          ${
            achievement.unlocked

              ? `
                <div class="unlocked-badge">
                  ✓ 已解锁
                </div>
              `

              : `
                <div class="achievement-progress-row">

                  <div class="achievement-mini-progress">

                    <div
                      class="achievement-mini-bar"
                      style="width:${percent}%"
                    ></div>

                  </div>


                  <div class="achievement-progress-text">
                    ${escapeHtml(currentText)}
                    /
                    ${escapeHtml(targetText)}
                  </div>

                </div>
              `
          }

        </div>

      </div>

    `;

  }


  function renderAchievements() {

    const all =
      getAllAchievements();


    const unlockedCount =
      all.filter(
        item =>
          item.unlocked
      ).length;


    const percent =
      all.length === 0
        ? 0
        : (
            unlockedCount /
            all.length
          ) * 100;


    document
      .getElementById(
        "achievementSummary"
      )
      .innerHTML = `

        <div class="achievement-summary-top">

          <div>

            <div class="achievement-summary-label">
              已解锁
            </div>

            <div class="achievement-summary-number">
              ${unlockedCount} / ${all.length}
            </div>

          </div>


          <div class="achievement-summary-percent">
            ${Math.round(percent)}%
          </div>

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${percent}%"
          ></div>

        </div>

      `;


    const list =
      document.getElementById(
        "achievementList"
      );


    list.innerHTML =
      "";


    /*
      全局成就
    */

    const global =
      getGlobalAchievements();


    const globalGroup =
      document.createElement(
        "div"
      );


    globalGroup.className =
      "achievement-group";


    globalGroup.innerHTML = `

      <div class="achievement-group-title">
        🌍 全局成就
      </div>

      ${global.map(
        renderAchievementCard
      ).join("")}

    `;


    list.appendChild(
      globalGroup
    );


    /*
      每个任务自己的成就
    */

    data.tasks.forEach(
      task => {

        const taskAchievements = [

          ...getTaskCountAchievements(
            task
          ),

          ...getTaskAmountAchievements(
            task
          )

        ];


        const group =
          document.createElement(
            "div"
          );


        group.className =
          "achievement-group";

      data.tasks.find(

    if (!task) {
      return;

    if (

      "fixed"

        task.oncePerDay &&
        getTodayRecords(
          task.id
        ).length > 0
      ) {

        showToast(
          "今天已经完成啦 ✓"
        );

        return;

      }


      recordCompletion(
        task,
        null,
        task.fixedXp,
        false
      );


      return;

    }


    completingTaskId =
      task.id;


    document
      .getElementById(
        "completeEmoji"
      )
      .innerText =
      task.emoji;


    document
      .getElementById(
        "completeName"
      )
      .innerText =
      task.name;


    document
      .getElementById(
        "completeUnit"
      )
      .innerText =
      task.unit;

  function calculateAmountXp(
    task,
    amount
  ) {

    return (
      Number(amount) /
      Number(task.amountBase)
    )
    *
    Number(task.xpPerBase);

  }


  function updateXpPreview() {

    const task =
      data.tasks.find(
        task =>
          task.id ===

    if (!task) {

          "xpPreview"

    const amount =
      Number(

            "completeAmount"

      );


    if (
      !Number.isFinite(amount) ||
      amount <= 0
    ) {

        .getElementById(
          "xpPreview"
        )
        .innerText =
        "获得 +0 XP";

      return;

    }


    const xp =
      calculateAmountXp(

      );


    document

        "xpPreview"

      .innerText =

    const task =
      data.tasks.find(

          task.id ===

    if (!task) {

      closeAmountModal();

      return;

    }


    const amount =

    }

  function recordCompletion(
    task,
    amount,
    xp,
    isAmountRecord
  ) {

    if (
      task.scoreMode === "fixed" &&
      task.oncePerDay &&
      getTodayRecords(task.id).length > 0
    ) {

      showToast(
        "今天已经完成啦 ✓"
      );

      return;

    }


    const recordId =
      makeId();


    data.history.push({

      id:
        recordId,

      taskId:
        task.id,

      date:
        getDateKey(),

      timestamp:
        new Date().toISOString(),

      xp:
        Number(xp),

      amount:
        amount,

      unit:
        isAmountRecord
          ? task.unit
          : "",

      scoreMode:
        task.scoreMode,

      isAmountRecord:
        isAmountRecord

    });


    saveData();

    render();


    let message =
      `${task.emoji} `;


    if (
      isAmountRecord
    ) {

      message +=
        `${formatAmount(
          amount,
          task.unit
        )} · `;

    }


    message +=
      `+${formatNumber(xp)} XP · 点击撤销`;


    showToast(
      message,

      function () {

        undoRecord(
          recordId
        );

      }
    );


    /*
      稍等一下再检查成就，
      避免和 +XP 的动画/提示同时出现。
    */

    setTimeout(
      checkNewAchievements,
      450
    );

  /* =========================================

  ========================================= */

  function getTotalXp() {

    return data.history.reduce(
      (total, record) =>
        total +
        Number(record.xp || 0),
      0
    );

  }


  function calculateLevel(
    totalXp
  ) {

    let level =
      1;


    let remaining =
      totalXp;


    let needed =
      100;


    while (
      remaining >= needed
    ) {

      remaining -=
        needed;


      level++;


      needed =
        100 +
        (level - 1) * 50;

    }


    return {

      level:
        level,

      currentXp:
        remaining,

      neededXp:
        needed

    };

  }


  function renderLevel() {

    const totalXp =
      getTotalXp();


    const result =
      calculateLevel(
        totalXp
      );


    document
      .getElementById(
        "level"
      )
      .innerText =
      `Lv. ${result.level}`;


    document
      .getElementById(
        "xpDisplay"
      )
      .innerText =
      `${formatNumber(result.currentXp)} / ${formatNumber(result.neededXp)} XP`;


    document
      .getElementById(
        "totalXp"
      )
      .innerText =
      `累计获得 ${formatNumber(totalXp)} XP`;


    const percent =
      Math.min(
        100,
        (
          result.currentXp /
          result.neededXp
        ) * 100
      );


    document
      .getElementById(
        "progressBar"
      )
      .style.width =
      percent + "%";

  }


  /* =========================================
     连续坚持
  ========================================= */

  function calculateStreak() {

    if (
      data.history.length === 0
    ) {

      return 0;

    }


    const dates =
      new Set(
        data.history.map(
          record =>
            record.date
        )
      );


    let cursor =
      new Date();


    let streak =
      0;


    if (
      !dates.has(
        getDateKey(cursor)
      )
    ) {

      cursor.setDate(
        cursor.getDate() - 1
      );

    }


    while (
      dates.has(
        getDateKey(cursor)
      )
    ) {

      streak++;


      cursor.setDate(
        cursor.getDate() - 1
      );

    }


    return streak;

  }


  function renderStreak() {

    document
      .getElementById(
        "streak"
      )
      .innerText =
      `🔥 连续坚持 ${calculateStreak()} 天`;

  }

        unit,
        amountBase,
        xpPerBase,

        oncePerDay: false

      editingTaskId

        id:

        ...taskData

      });

  /* =========================================
     撤销最近一次
  ========================================= */

  function undoRecentTask() {

    if (!editingTaskId) {
      return;
    }


    const task =
      data.tasks.find(
        task =>
          task.id ===
          editingTaskId
      );


    if (!task) {
      return;
    }


    let lastIndex =
      -1;


    let newestTime =
      -Infinity;


    data.history.forEach(
      (record, index) => {

        if (
          record.taskId !==
          editingTaskId
        ) {
          return;
        }


        const time =
          new Date(
            record.timestamp
          ).getTime();


        if (
          time > newestTime
        ) {

          newestTime =
            time;

          lastIndex =
            index;

        }

      }
    );


    if (
      lastIndex === -1
    ) {

      alert(
        "这个任务还没有完成记录。"
      );

      return;

    }


    const record =
      data.history[
        lastIndex
      ];


    let text =
      `日期：${record.date}\n`;


    if (
      record.isAmountRecord === true &&
      record.amount !== null
    ) {

      text +=
        `完成量：${formatAmount(
          record.amount,
          record.unit || task.unit
        )}\n`;

    }


    text +=
      `XP：${formatNumber(record.xp)}`;


    const confirmed =
      confirm(
        `确定撤销「${task.name}」最近的一次记录吗？\n\n${text}`
      );


    if (!confirmed) {
      return;
    }


    data.history.splice(
      lastIndex,
      1
    );


    saveData();

    closeTaskModal();

    render();


    showToast(
      "↩️ 已撤销最近一次完成"
    );

  }

  let toastTimer =

    null;


  function showToast(
    message,
    action = null
  ) {

    const toast =
      document.getElementById(
        "toast"
      );


    clearTimeout(
      toastTimer
    );


    toast.innerText =
      message;


    toastAction =
      action;


    toast.classList.add(
      "show"
    );


    toast.classList.toggle(
      "clickable",
      !!action
    );


    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            "show",
            "clickable"
          );


          toastAction =
            null;

        },
        3500
      );

  }


  document
    .getElementById(
      "toast"
    )
    .addEventListener(
      "click",
      function () {

        if (!toastAction) {
          return;
        }


        const action =
          toastAction;


        toastAction =
          null;


        clearTimeout(
          toastTimer
        );


        this.classList.remove(
          "show",
          "clickable"
        );


        action();

      }
    );

    );


  document
    .getElementById(
      "unlockModal"
    )
    .addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          this
        ) {

          closeUnlockModal();

        }

      }
    );


  /* =========================================
     总刷新
  ========================================= */

  function render() {

    showDate();

    renderTasks();

    renderLevel();

    renderStreak();


    if (
      currentPage ===
      "achievement"
    ) {

      renderAchievements();

    }

  }


  render();

</script>

</body>

</html>
